app-id: com.todoist.Todoist
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: todoist
tags:
  - proprietary
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - shared-modules/squashfs-tools/squashfs-tools.json

  - name: todoist
    buildsystem: simple
    build-commands:
      - install -D apply_extra "${FLATPAK_DEST}/bin/apply_extra"
      - install todoist.sh "${FLATPAK_DEST}/bin/todoist"
    post-install:
      - install -p -Dm644 "icon.png" "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png"
      - install -Dm644 todoist.desktop "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - install -Dm644 com.todoist.Todoist.metainfo.xml "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml"
    sources:
      - type: extra-data
        only-arches: [x86_64]
        filename: todoist.snap
        url: https://api.snapcraft.io/api/v1/snaps/download/pP800io06HKwwkUmX8gDG1pFCfsinLHY_1359.snap
        sha256: befb451f257dcbd314d59de296b7339290586006f6a2255a92cb2e8838381998
        size: 112746496
        x-checker-data:
          type: snapcraft
          name: todoist
          channel: stable
      - type: extra-data
        only-arches: [aarch64]
        filename: todoist.AppImage
        url: https://electron-dl.todoist.net/linux/Todoist-linux-9.30.0-arm64-latest.AppImage
        sha256: ef18cf1125d6dec1c6c54ff17ee4ce6037e1e6c2cf4f09b8c6c824268c030d5e
        size: 131550634
        x-checker-data:
          type: electron-updater
          url: https://electron-dl.todoist.net/linux/latest-linux-arm64.yml
      - type: script
        only-arches: [x86_64]
        dest-filename: apply_extra
        commands:
          # TODO: Spotify simply includes -no-progress here and does not create
          # noise, but it does not work here
          - unsquashfs todoist.snap 1>/dev/null
          - rm todoist.snap
          # TODO: This moves in a lot of junk too
          - mv squashfs-root todoist
          - touch todoist/chrome-sandbox && chmod +x todoist/chrome-sandbox
      - type: script
        only-arches: [aarch64]
        dest-filename: apply_extra
        commands:
          - set -eu
          # Read the ELF64 section table to locate the appended SquashFS.
          # The AppImage runtime itself requires the unversioned libz.so.
          - shoff=$(od -An -tu8 -j40 -N8 todoist.AppImage)
          - shentsize=$(od -An -tu2 -j58 -N2 todoist.AppImage)
          - shnum=$(od -An -tu2 -j60 -N2 todoist.AppImage)
          - unsquashfs -no-progress -o "$((shoff + shentsize * shnum))" todoist.AppImage 1>/dev/null
          - rm todoist.AppImage
          # Match the Snap layout used by todoist.sh.
          - mkdir todoist
          - mv squashfs-root todoist/app
      - type: file
        path: todoist.sh
      - type: file
        path: com.todoist.Todoist.metainfo.xml
      - type: file
        path: todoist.desktop
      - type: file
        path: icon.png
